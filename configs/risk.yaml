# configs/risk.yaml
pre_trade:
  - rule: MaxPosition
    params:
      max_pct: 0.2
  - rule: DailyLossLimit
    params:
      max_loss_pct: 0.05
  - rule: PriceLimit
  - rule: SectorLimit
    params:
      max_pct: 0.3
      # sector_map should be populated with ticker->sector mapping, e.g.:
      # sector_map:
      #   "000001.SZ": "Finance"
      #   "600519.SH": "Consumer"

realtime:
  var_confidence: 0.99
  max_drawdown: 0.15
  beta_limit: 1.5

blacklist: []
