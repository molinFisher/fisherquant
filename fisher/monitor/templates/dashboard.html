{% extends "base.html" %}
{% block title %}Dashboard - FisherQuant{% endblock %}
{% block content %}
<div class="grid">
    <div class="card">
        <h2>NAV</h2>
        <div style="font-size:32px;font-weight:700;color:#1a1a2e;" hx-get="/api/overview" hx-trigger="every 5s" hx-target="#nav-value">
            <span id="nav-value">1,000,000.00</span>
        </div>
        <div style="color:#888;margin-top:4px;">Total Portfolio Value</div>
    </div>
    <div class="card">
        <h2>Daily P&L</h2>
        <div style="font-size:32px;font-weight:700;" id="daily-pnl">+0.00%</div>
        <div style="color:#888;margin-top:4px;">Today</div>
    </div>
    <div class="card">
        <h2>Positions</h2>
        <div style="font-size:32px;font-weight:700;color:#1a1a2e;" id="pos-count">0</div>
        <div style="color:#888;margin-top:4px;">Active</div>
    </div>
    <div class="card">
        <h2>Orders</h2>
        <div style="font-size:32px;font-weight:700;color:#1a1a2e;" id="order-count">0</div>
        <div style="color:#888;margin-top:4px;">Active</div>
    </div>
</div>
<div class="card" style="margin-top:16px;">
    <h2>NAV Chart</h2>
    <canvas id="navChart" height="120"></canvas>
</div>
<div class="card">
    <h2>Recent Alerts</h2>
    <div id="alerts-list" hx-get="/api/risk" hx-trigger="every 10s">
        <p style="color:#888;">No alerts</p>
    </div>
</div>
<script>
    const ctx = document.getElementById('navChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'NAV', borderColor: '#1a1a2e', data: [], fill: false }] },
        options: { responsive: true, maintainAspectRatio: true }
    });
</script>
{% endblock %}
