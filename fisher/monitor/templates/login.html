{% extends "base.html" %}
{% block title %}Login - FisherQuant{% endblock %}
{% block content %}
<style>
    .login-container { max-width: 380px; margin: 80px auto; }
    .login-card { padding: 32px; }
    .login-card h1 { text-align: center; margin-bottom: 24px; color: #1a1a2e; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #1a1a2e; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #16213e; }
    .error { color: #c62828; text-align: center; margin-top: 8px; font-size: 13px; }
</style>
<div class="login-container">
    <div class="card login-card">
        <h1>FisherQuant</h1>
        <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML">
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="login-error" class="error"></div>
    </div>
</div>
{% endblock %}
